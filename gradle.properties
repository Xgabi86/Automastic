org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# --- Minecraft / NeoForge ---
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
neo_version=21.1.241
neo_version_range=[21.1.241,)
loader_version_range=[1,)

# --- Parchment (noms de paramètres lisibles, optionnel) ---
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# --- Mod ---
mod_id=automastic
mod_name=Automastic
mod_group_id=fr.aethernode.automastic
# Version du mod (MAJEUR.MINEUR.PATCH). C'est CE champ qu'on change pour une nouvelle version.
mod_version=0.2.0
# Channel du build : alpha | beta | release
#  - alpha / beta : le channel est ajouté à la version (0.1.0-alpha, 0.1.0-beta)
#  - release      : version seule (0.1.0)
# Surchargeable en ligne de commande sans éditer ce fichier :
#   ./gradlew build -Pmod_channel=beta
#   ./gradlew build -Pmod_channel=release -Pmod_version=0.2.0
mod_channel=alpha
mod_license=MIT
mod_authors=Aethernode
mod_description=Automation machines for farming. Harvester with output inventory. Compatible with Mystical Agriculture.
